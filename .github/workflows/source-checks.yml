name: Source checks

on:
  push:
    branches: ['ui/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-and-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install fixed offline check dependencies
        run: python -m pip install Pillow==12.3.0 lupa==2.8
      - name: Python and Lua contracts
        run: python scripts/check.py
      - name: Hidden interface checks with synthetic input
        run: python scripts/gui_smoke.py
      - name: Compile macOS helper and check a private pasteboard
        if: runner.os == 'macOS'
        run: |
          python scripts/build_native.py
          python scripts/check_macos_clipboard.py
