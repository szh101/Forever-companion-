name: Source checks

on:
  push:
    branches: ['ui/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install fixed offline check dependencies
        run: python -m pip install Pillow==12.3.0 lupa==2.8
      - name: Python and Lua contracts
        run: python scripts/check.py
      - name: Hidden interface checks with synthetic input
        timeout-minutes: 2
        run: python -u -c "import faulthandler,runpy; faulthandler.dump_traceback_later(60,exit=True); runpy.run_path('scripts/gui_smoke.py',run_name='__main__'); faulthandler.cancel_dump_traceback_later()"
      - name: Compile macOS helper and check a private pasteboard
        if: runner.os == 'macOS'
        run: |
          python scripts/build_native.py
          python scripts/check_macos_clipboard.py
      - name: Check Windows application entry point with synthetic input
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: python -X utf8 scripts/windows_entry.py --self-test-report .runtime/source-entry-check.json
