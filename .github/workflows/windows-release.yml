name: Windows installer release

on:
  push:
    branches: [main]
    paths: [release/windows.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  macos-check:
    if: github.ref == 'refs/heads/main' && github.repository == 'szh101/Forever-companion-'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned contract-test dependencies
        run: |
          python -m pip install Pillow==12.3.0 lupa==2.8
      - name: Python and Lua contracts
        run: python scripts/check.py
      - name: Compile macOS capture helper without running it
        run: python scripts/build_native.py
      - name: Check native clipboard on a private synthetic pasteboard
        run: python scripts/check_macos_clipboard.py

  windows-release:
    if: github.repository == 'szh101/Forever-companion-'
    needs: macos-check
    # The capture source uses WinRT metadata introduced in Windows build 26100.
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install fixed build dependencies
        run: python -m pip install -r requirements-windows-build.txt
      - name: Build fixed source and run offline checks
        run: python -X utf8 scripts/build_windows.py --commit $env:GITHUB_SHA
      - name: Build and verify the installer in a synthetic client directory
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw 'The Windows runner does not have Inno Setup 6 installed.'
          }
          python -X utf8 scripts/build_windows_installer.py --commit $env:GITHUB_SHA --iscc $iscc --test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit the bundled files and installer for private build data
        shell: pwsh
        run: |
          $output = 'dist/windows-' + $env:GITHUB_SHA.Substring(0, 12)
          python -X utf8 scripts/check_windows_package_privacy.py --app "$output/Forever AI" --installer "$output/ForeverAI-Setup-x64.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify and publish the download assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -X utf8 scripts/release_windows.py --commit $env:GITHUB_SHA --publish
      - name: Show failed offline build diagnostics
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath '.runtime') {
            Get-ChildItem -LiteralPath '.runtime' -Recurse -File -Filter '*.log' | ForEach-Object {
              Write-Output $_.Name
              Get-Content -LiteralPath $_.FullName -Tail 80
            }
          }
